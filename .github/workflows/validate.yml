name: Validate Fedora Foundation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install dependencies
        run: dnf install -y git bash findutils grep sed gawk coreutils shellcheck

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run validations
        run: tests/run.sh
