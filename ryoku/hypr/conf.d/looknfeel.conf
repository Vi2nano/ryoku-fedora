general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  layout = dwindle
}

decoration {
  rounding = 8
  blur {
    enabled = yes
    size = 4
    passes = 1
  }
}

animations {
  enabled = yes
}

