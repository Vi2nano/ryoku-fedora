# ryoku-fedora base Hyprland config
# Project-owned includes live under ~/.config/ryoku-fedora/hypr

source = ~/.config/ryoku-fedora/hypr/conf.d/env.conf
source = ~/.config/ryoku-fedora/hypr/conf.d/inputs.conf
source = ~/.config/ryoku-fedora/hypr/conf.d/looknfeel.conf
source = ~/.config/ryoku-fedora/hypr/conf.d/bindings.conf
source = ~/.config/ryoku-fedora/hypr/conf.d/startup.conf

# User override include (auto-generated by install script if missing)
source = ~/.config/hypr/ryoku-user-overrides.conf
